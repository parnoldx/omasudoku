  <!-- Top row: green, selection, cyan -->
  <rect x="87" y="87" width="98" height="98" rx="21" fill="#a3be8c"/>
  <rect x="207" y="87" width="98" height="98" rx="21" fill="#434c5e"/>
  <rect x="327" y="87" width="98" height="98" rx="21" fill="#88c0d0"/>
  <!-- Middle row: selection, yellow, selection -->
  <rect x="87" y="207" width="98" height="98" rx="21" fill="#434c5e"/>
  <rect x="207" y="207" width="98" height="98" rx="21" fill="#ebcb8b"/>
  <rect x="327" y="207" width="98" height="98" rx="21" fill="#434c5e"/>
  <!-- Bottom row: orange, selection, magenta -->
  <rect x="87" y="327" width="98" height="98" rx="21" fill="#d5967a"/>
  <rect x="207" y="327" width="98" height="98" rx="21" fill="#434c5e"/>
